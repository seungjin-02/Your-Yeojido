name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify bundled Australian data
        run: npm run data:prepare
      - name: Test Australia workflow
        run: npx vitest run src/australia.test.ts
      - name: Build for the project site
        run: npm run build -- --base=/${{ github.event.repository.name }}/
      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      deployments: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Clear stalled Pages deployment from filter alignment release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYCODE'
          import json, os, urllib.request, urllib.error
          root = 'https://api.github.com/repos/${{ github.repository }}'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}
          def request(path, method='GET'):
              req = urllib.request.Request(root + path, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req) as response:
                      body = response.read()
                      return json.loads(body) if body else {}
              except urllib.error.HTTPError as error:
                  if error.code in (404, 409):
                      print('::notice::Cleanup response HTTP ' + str(error.code))
                      return {}
                  raise
          deployments = request('/deployments?sha=63950a9fa3d513af88329cf43edcb28d48c21ca4&environment=github-pages&per_page=10')
          for deployment in deployments:
              deployment_id = deployment['id']
              print('::notice::Cancel stalled Pages deployment ID ' + str(deployment_id))
              request('/pages/deployments/' + str(deployment_id) + '/cancel', 'POST')
          PYCODE
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
